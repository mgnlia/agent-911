[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./runbooks" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
zerog_testnet = "https://evmrpc-testnet.0g.ai"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
# (configure after deploy)

# See https://book.getfoundry.sh/reference/config
